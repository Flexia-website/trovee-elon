# Trovee Nginx Configuration
# Nginx server block for Trovee SEO landing page

server {
    listen 80;
    listen [::]:80;
    server_name trovee.com www.trovee.com *.trovee.com;
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trovee.com www.trovee.com;
    
    # SSL Configuration
    ssl_certificate /path/to/certificate.crt;
    ssl_certificate_key /path/to/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/rss+xml application/json;
    
    # Root directory
    root /var/www/trovee;
    
    # Index files
    index index.html index.htm;
    
    # Logging
    access_log /var/log/nginx/trovee_access.log;
    error_log /var/log/nginx/trovee_error.log;
    
    # Remove www prefix
    if ($host ~* ^www\.(.*)$) {
        return 301 https://$1$request_uri;
    }
    
    # Main redirect - send all traffic to trovee-hq.onrender.com
    location / {
        return 301 https://trovee-hq.onrender.com$request_uri;
    }
    
    # Allow robots.txt and sitemap.xml for search engines
    location ~ ^/(robots\.txt|sitemap.*\.xml)$ {
        try_files $uri =404;
        access_log off;
    }
    
    # Allow .well-known for SSL verification
    location ~ ^/\.well-known/ {
        try_files $uri =404;
    }
    
    # Caching for static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # 404 error page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
